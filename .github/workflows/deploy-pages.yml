# Build with Vite and publish to GitHub Pages.
#
# One-time repo setup (after merging this file):
#   1. Settings → Pages → Build and deployment → Source: GitHub Actions
#   2. Settings → Actions → General → Workflow permissions:
#      enable "Read and write permissions" (needed for Pages deployment)
#
# Default URL: https://<owner>.github.io/<repo>/
# The workflow sets VITE_BASE_PATH=/<repo>/ so asset URLs resolve.
#
# Custom domain later:
#   1. Add a one-line file: public/CNAME  (contents: your.domain.com)
#   2. Settings → Pages → Custom domain → enter the same hostname
#   3. In THIS workflow, set env VITE_BASE_PATH: "/"  (site is served at apex)
#   4. Follow GitHub's DNS instructions for your registrar

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Project Pages lives under /<repo>/ ; override with "/" when using a custom apex domain
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
